name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: api,gmail,web,analysis,notifications,manager or "all")'
        required: false
        default: "all"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: crm
  VPC_NAME: crm-vpc
  SUBNET_NAME: crm-subnet

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      api: ${{ steps.filter.outputs.api }}
      gmail: ${{ steps.filter.outputs.gmail }}
      web: ${{ steps.filter.outputs.web }}
      analysis: ${{ steps.filter.outputs.analysis }}
      addon: ${{ steps.filter.outputs.addon }}
      notifications: ${{ steps.filter.outputs.notifications }}
      manager: ${{ steps.filter.outputs.manager }}
      deploy-all: ${{ steps.check.outputs.deploy-all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            api:
              - 'apps/api/**'
            gmail:
              - 'apps/gmail/**'
            web:
              - 'apps/web/**'
            analysis:
              - 'apps/analysis/**'
            notifications:
              - 'apps/notifications/**'
            manager:
              - 'apps/manager/**'
            addon:
              - 'apps/addon/**'

      - name: Determine deployment strategy
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.services }}" == "all" ]; then
              echo "deploy-all=true" >> $GITHUB_OUTPUT
            else
              echo "deploy-all=false" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ steps.filter.outputs.packages }}" == "true" ]; then
            echo "deploy-all=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-all=false" >> $GITHUB_OUTPUT
          fi

  # ─── Deploy: crm-api ─────────────────────────────────────────────────────
  deploy-api:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy-all == 'true' ||
      needs.detect-changes.outputs.api == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.services, 'api'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-api"
          docker build -f apps/api/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          SUBNET="projects/${{ env.PROJECT_ID }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }}"

          gcloud run deploy crm-api \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-api:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account "crm-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network ${{ env.VPC_NAME }} \
            --subnet "${SUBNET}" \
            --vpc-egress all-traffic \
            --ingress all \
            --allow-unauthenticated \
            --update-env-vars "\
          NODE_ENV=production,\
          LOG_LEVEL=info" \
            --update-secrets "\
          DATABASE_URL=DATABASE_URL:latest,\
          BETTER_AUTH_SECRET=BETTER_AUTH_SECRET:latest,\
          GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,\
          GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,\
          SERVICE_API_KEY=SERVICE_API_KEY:latest,\
          ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest,\
          CLOUDSQL_SERVER_CA=CLOUDSQL_SERVER_CA:latest,\
          CLOUDSQL_CLIENT_CERT=CLOUDSQL_CLIENT_CERT:latest,\
          CLOUDSQL_CLIENT_KEY=CLOUDSQL_CLIENT_KEY:latest" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 100

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe crm-api --region ${{ env.REGION }} --format 'value(status.url)')
          echo "### crm-api Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** crm-api:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy: crm-gmail ───────────────────────────────────────────────────
  deploy-gmail:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy-all == 'true' ||
      needs.detect-changes.outputs.gmail == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.services, 'gmail'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-gmail"
          docker build -f apps/gmail/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          SUBNET="projects/${{ env.PROJECT_ID }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }}"

          gcloud run deploy crm-gmail \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-gmail:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account "crm-gmail-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network ${{ env.VPC_NAME }} \
            --subnet "${SUBNET}" \
            --vpc-egress all-traffic \
            --ingress all \
            --no-allow-unauthenticated \
            --update-env-vars "\
          NODE_ENV=production,\
          LOG_LEVEL=info,\
          GMAIL_PUBSUB_TOPIC=projects/project-y-email-sentiment/topics/crm-gmail-push,\
          GOOGLE_CLOUD_PROJECT_ID=project-y-email-sentiment" \
            --update-secrets "\
          DATABASE_URL=DATABASE_URL:latest,\
          SERVICE_API_KEY=SERVICE_API_KEY:latest,\
          ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest,\
          GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,\
          GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,\
          CLOUDSQL_SERVER_CA=CLOUDSQL_SERVER_CA:latest,\
          CLOUDSQL_CLIENT_CERT=CLOUDSQL_CLIENT_CERT:latest,\
          CLOUDSQL_CLIENT_KEY=CLOUDSQL_CLIENT_KEY:latest" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 80

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe crm-gmail --region ${{ env.REGION }} --format 'value(status.url)')
          echo "### crm-gmail Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** crm-gmail:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy: crm-web ─────────────────────────────────────────────────────
  deploy-web:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy-all == 'true' ||
      needs.detect-changes.outputs.web == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.services, 'web'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-web"
          docker build -f apps/web/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          SUBNET="projects/${{ env.PROJECT_ID }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }}"

          gcloud run deploy crm-web \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-web:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --port 8080 \
            --service-account "crm-web-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network ${{ env.VPC_NAME }} \
            --subnet "${SUBNET}" \
            --vpc-egress private-ranges-only \
            --ingress all \
            --allow-unauthenticated \
            --update-env-vars "NODE_ENV=production" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 256Mi \
            --cpu 1 \
            --timeout 30 \
            --concurrency 1000

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe crm-web --region ${{ env.REGION }} --format 'value(status.url)')
          echo "### crm-web Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** crm-web:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy: crm-analysis ────────────────────────────────────────────────
  deploy-analysis:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy-all == 'true' ||
      needs.detect-changes.outputs.analysis == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.services, 'analysis'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-analysis"
          docker build -f apps/analysis/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          SUBNET="projects/${{ env.PROJECT_ID }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }}"

          gcloud run deploy crm-analysis \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-analysis:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account "crm-analysis-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network ${{ env.VPC_NAME }} \
            --subnet "${SUBNET}" \
            --vpc-egress all-traffic \
            --ingress internal \
            --no-allow-unauthenticated \
            --update-env-vars "\
          NODE_ENV=production,\
          LOG_LEVEL=info" \
            --update-secrets "\
          DATABASE_URL=DATABASE_URL:latest,\
          SERVICE_API_KEY=SERVICE_API_KEY:latest,\
          ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest,\
          HUGGINGFACE_API_TOKEN=HUGGINGFACE_TOKEN:latest,\
          GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:latest,\
          CLOUDSQL_SERVER_CA=CLOUDSQL_SERVER_CA:latest,\
          CLOUDSQL_CLIENT_CERT=CLOUDSQL_CLIENT_CERT:latest,\
          CLOUDSQL_CLIENT_KEY=CLOUDSQL_CLIENT_KEY:latest" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 2 \
            --timeout 600 \
            --concurrency 50

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe crm-analysis --region ${{ env.REGION }} --format 'value(status.url)')
          echo "### crm-analysis Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** crm-analysis:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy: crm-notifications ───────────────────────────────────────────
  deploy-notifications:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy-all == 'true' ||
      needs.detect-changes.outputs.notifications == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.services, 'notifications'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-notifications"
          docker build -f apps/notifications/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          SUBNET="projects/${{ env.PROJECT_ID }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }}"

          gcloud run deploy crm-notifications \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-notifications:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account "crm-notifications-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network ${{ env.VPC_NAME }} \
            --subnet "${SUBNET}" \
            --vpc-egress all-traffic \
            --ingress all \
            --allow-unauthenticated \
            --update-env-vars "\
          NODE_ENV=production,\
          LOG_LEVEL=info" \
            --update-secrets "\
          DATABASE_URL=DATABASE_URL:latest,\
          SERVICE_API_KEY=SERVICE_API_KEY:latest,\
          INNGEST_EVENT_KEY=INNGEST_EVENT_KEY:latest,\
          INNGEST_SIGNING_KEY=INNGEST_SIGNING_KEY:latest,\
          CLOUDSQL_SERVER_CA=CLOUDSQL_SERVER_CA:latest,\
          CLOUDSQL_CLIENT_CERT=CLOUDSQL_CLIENT_CERT:latest,\
          CLOUDSQL_CLIENT_KEY=CLOUDSQL_CLIENT_KEY:latest" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 80

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe crm-notifications --region ${{ env.REGION }} --format 'value(status.url)')
          echo "### crm-notifications Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** crm-notifications:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy: crm-manager ─────────────────────────────────────────────────
  #
  # The manager dashboard API behind the extension's Dashboard / AI Analysis /
  # Customers / Users tabs.
  #
  # Two things differ from the services above:
  #   * --no-allow-unauthenticated. Access is IAM, not application-layer: this
  #     service has no login of its own, so anyone who can reach it can read the
  #     whole CRM. Callers reach it through `gcloud run services proxy`, which
  #     attaches the operator's identity token. Grant access per person with
  #     roles/run.invoker (see apps/manager/README.md).
  #   * Not triggered by deploy-all. That flag is set whenever packages/**
  #     changes, and this service depends on nothing in packages/ — it is plain
  #     CommonJS with two npm deps.
  #
  # Note the `^@^` prefix on --update-env-vars: TEAM_EMAIL_DOMAINS contains a
  # comma, which is gcloud's default ArgDict separator. Backslash-escaping it
  # does NOT work — gcloud rejects it with "Bad syntax for dict arg" — so the
  # separator is switched to @ for that flag. See `gcloud topic escaping`.
  deploy-manager:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.manager == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'manager')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-manager"
          docker build -f apps/manager/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          SUBNET="projects/${{ env.PROJECT_ID }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }}"

          gcloud run deploy crm-manager \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-manager:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account "crm-manager-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network ${{ env.VPC_NAME }} \
            --subnet "${SUBNET}" \
            --vpc-egress all-traffic \
            --ingress all \
            --no-allow-unauthenticated \
            --update-env-vars "^@^NODE_ENV=production@TEAM_EMAIL_DOMAINS=mytaxfiler.com,mystartupcfo.com" \
            --update-secrets "\
          DATABASE_URL=DATABASE_URL:latest,\
          CLOUDSQL_SERVER_CA=CLOUDSQL_SERVER_CA:latest,\
          CLOUDSQL_CLIENT_CERT=CLOUDSQL_CLIENT_CERT:latest,\
          CLOUDSQL_CLIENT_KEY=CLOUDSQL_CLIENT_KEY:latest" \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --concurrency 40

      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe crm-manager --region ${{ env.REGION }} --format 'value(status.url)')
          echo "### crm-manager Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** crm-manager:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Access:** IAM-gated — reach it with \`gcloud run services proxy crm-manager --region ${{ env.REGION }} --port 8080\`" >> $GITHUB_STEP_SUMMARY

  # crm-addon — the Google Workspace Add-on.
  #
  # Unlike the Chrome extension, this is NOT redistributed to users. The card is
  # rendered server-side by this service, so deploying it updates every installed
  # user at once with no reinstall. The Marketplace deployment only holds a URL.
  #
  # --ingress all (not internal): Google's own servers call the trigger and
  # action endpoints from outside the VPC. Requests are authenticated by the
  # signed ID token Google sends, verified in auth/verify.ts, which is why
  # ADDON_VERIFY_ID_TOKEN must be true here.
  #
  # PREREQUISITES, none of which this job creates:
  #   - service account: crm-api-sa@, which is what the running service uses.
  #     crm-addon-sa@ was named here and never created, so every CI deploy of
  #     this service died on `PERMISSION_DENIED: Permission
  #     'iam.serviceaccounts.actAs' denied on service account crm-addon-sa@ (or
  #     it may not exist)`. Giving the add-on its own identity is the right end
  #     state — it holds gmail scopes crm-api does not need — but creating one
  #     changes the runtime identity and what it can reach in Secret Manager,
  #     which is a migration, not a build fix. Until then CI names the account
  #     the service actually runs as.
  #   - secret  ADDON_GOOGLE_CLIENT_ID   the add-on's OWN OAuth client id, from
  #     Marketplace SDK > Credentials. NOT crm-oauth: Google mints
  #     event.userIdToken for the add-on's client, so verifying against the CRM
  #     client checks the wrong audience and every request fails to verify.
  # SERVICE_API_URL is a plain env var, NOT a secret. It is the crm-api base
  # URL — public, printed by `gcloud run services describe`, and carrying
  # nothing worth protecting. It was declared here as a secret named
  # ADDON_SERVICE_API_URL that was never created, and the live service had it as
  # a literal, so every deploy of this service failed on `Cannot update
  # environment variable [SERVICE_API_URL] to the given type because it has
  # already been set with a different type` before it ever got as far as the
  # missing secret.
  # Deploying without these gives a service that starts and then rejects every
  # request Google sends it.
  deploy-addon:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy-all == 'true' ||
      needs.detect-changes.outputs.addon == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.services, 'addon'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-addon"
          docker build -f apps/addon/Dockerfile -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          SUBNET="projects/${{ env.PROJECT_ID }}/regions/${{ env.REGION }}/subnetworks/${{ env.SUBNET_NAME }}"

          gcloud run deploy crm-addon \
            --image "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/crm-addon:${{ github.sha }}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --service-account "crm-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --network ${{ env.VPC_NAME }} \
            --subnet "${SUBNET}" \
            --vpc-egress private-ranges-only \
            --ingress all \
            --allow-unauthenticated \
            --update-env-vars "\
          NODE_ENV=production,\
          LOG_LEVEL=info,\
          ADDON_VERIFY_ID_TOKEN=true,\
          LIVE_ANALYSIS_PROVIDER=gemini,\
          LIVE_ANALYSIS_MODEL=gemini-3.1-flash-lite,\
          LIVE_ANALYSIS_REASONING=none,\
          LIVE_ANALYSIS_TIMEOUT_MS=20000,\
          SERVICE_API_URL=https://crm-api-203731638840.us-central1.run.app" \
            --update-secrets "\
          SERVICE_API_KEY=SERVICE_API_KEY:latest,\
          LIVE_ANALYSIS_KEY=GOOGLE_GENERATIVE_AI_API_KEY:latest,\
          GOOGLE_CLIENT_ID=ADDON_GOOGLE_CLIENT_ID:latest" \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 120 \
            --concurrency 40

      - name: Point the add-on at this revision
        run: |
          URL=$(gcloud run services describe crm-addon --region ${{ env.REGION }} --format 'value(status.url)')
          gcloud run services update crm-addon --region ${{ env.REGION }} \
            --update-env-vars "ADDON_BASE_URL=${URL},ADDON_AUDIENCE=${URL}"
          echo "### crm-addon Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The Marketplace deployment still points at whatever URL it was" >> $GITHUB_STEP_SUMMARY
          echo "registered with. If this URL changed, update it:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "gcloud workspace-add-ons deployments replace inboxpulse-live --deployment-file=apps/addon/deployment.json" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
