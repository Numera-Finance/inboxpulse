# Cloud Build config: builds the InboxPulse manager image from the monorepo.
#
# Build context is the repo ROOT (the trailing '.' in the submit command) even
# though this service needs only apps/manager — keeping the context and the
# Dockerfile's paths identical to the `deploy-manager` GitHub Actions job means
# both routes produce the same image.
#
#   gcloud builds submit --config=apps/manager/cloudbuild.yaml \
#     --substitutions=_IMAGE=us-central1-docker.pkg.dev/project-y-email-sentiment/crm/crm-manager:manual \
#     .
#
# See .gcloudignore — node_modules, .env files and certs/ are excluded from the
# uploaded context.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'apps/manager/Dockerfile', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  machineType: 'E2_HIGHCPU_8'
timeout: '1200s'
