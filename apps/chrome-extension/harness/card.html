<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InboxPulse Panel tab harness</title>
    <style>
      /* Approximates Gmail's right-hand rail: a fixed ~400px column against a
         page-coloured backdrop, so overflow past the panel edge is obvious. */
      body {
        margin: 0;
        background: #e8eaed;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #panel {
        width: 400px;
        height: 100vh;
        background: #fff;
        border-left: 1px solid #dadce0;
        overflow-y: auto;
        box-sizing: border-box;
      }
      /* Proves, visibly, that a card link did NOT navigate to the console. */
      #qa-log {
        position: fixed;
        right: 12px;
        bottom: 12px;
        max-width: 460px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #202124;
        color: #e8eaed;
        font-size: 12px;
        line-height: 1.5;
        display: none;
      }
      #qa-log b {
        color: #8ab4f8;
      }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div id="qa-log"></div>
    <script>
      // ?w=1200 widens the panel, so a narrow-layout regression can be told
      // apart from a fault that reproduces at any width.
      const w = new URLSearchParams(location.search).get('w');
      if (w) document.getElementById('panel').style.width = `${parseInt(w, 10)}px`;
    </script>
    <script type="module" src="./card.tsx"></script>
  </body>
</html>
